services:
  # Backend API
  - type: web
    name: hackathon-energia-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    branch: development
    plan: free                    # <-- AGREGA ESTO
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: hackathon-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: hackathon-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: hackathon-db
          property: password
    healthCheckPath: /api/health

  # Frontend
  - type: web
    name: hackathon-energia-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    branch: development
    plan: free                    # <-- AGREGA ESTO
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hackathon-energia-backend
          property: host

databases:
  - name: hackathon-db
    databaseName: hackathon
    user: hackathon
    plan: free
