services:
  # Backend API
  - type: web
    name: hackathon-energia-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    branch: development
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
    healthCheckPath: /api/health

  # Frontend
  - type: web
    name: hackathon-energia-frontend
    runtime: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    branch: development
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hackathon-energia-backend
          property: host

databases:
  - name: hackathon-db
    databaseName: hackathon
    user: hackathon
    plan: free
